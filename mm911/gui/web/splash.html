<!doctype html>
<html><head><meta charset="utf-8"><title>Money Maker 911</title>
<style>
  html,body{margin:0;height:100%;background:#0E0E12;color:#fff;font-family:"Segoe UI Variable Display","Segoe UI",-apple-system,system-ui,sans-serif;overflow:hidden;user-select:none}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
        background:radial-gradient(600px 300px at 50% 35%,rgba(255,70,80,.18),transparent 70%)}
  .logo{width:112px;height:112px;border-radius:26px;box-shadow:0 20px 60px rgba(255,50,70,.35);animation:pop .9s cubic-bezier(.2,1.4,.4,1) both}
  h1{margin:0;font-size:26px;font-weight:600;letter-spacing:-.4px;animation:fade .8s .25s both}
  .sub{margin-top:-10px;font-size:13px;color:#9a9aa5;animation:fade .8s .4s both;display:flex;align-items:center;gap:7px}
  .yt{display:inline-flex;align-items:center;justify-content:center;width:22px;height:15px;border-radius:4px;background:#FF3040}
  .yt:after{content:"";border-left:6px solid #fff;border-top:4px solid transparent;border-bottom:4px solid transparent;margin-left:1px}
  .bar{width:180px;height:3px;border-radius:3px;background:#24242b;overflow:hidden;margin-top:10px}
  .bar i{display:block;height:100%;width:40%;border-radius:3px;background:linear-gradient(90deg,#FF5E57,#D6203C);animation:load 1.1s ease-in-out infinite}
  .credit{position:absolute;bottom:14px;width:100%;text-align:center;font-size:11px;color:#5d5d68;letter-spacing:.2px}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes load{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
</style></head>
<body><div class="wrap">
  <img class="logo" src="logo.png" alt="">
  <h1>Money Maker 911</h1>
  <div class="sub"><span class="yt"></span> Shorts Studio</div>
  <div class="bar"><i></i></div>
</div>
<div class="credit">made by TeamRealHackers</div>
</body></html>
