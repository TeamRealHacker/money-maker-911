name: Build Windows .exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
          pip install -r requirements-ai.txt

      - name: Tests
        run: python -m pytest -q
      - name: Smoke test (render a 4s clip)
        run: python main.py render --preset presets/smoke_test.json --out output/smoke.mp4

      - name: Smoke test (emoji tiers + thumbnail)
        run: python main.py thumb --preset presets/emoji_fruit.json --seed 12 --out output/thumb.jpg

      - name: Smoke test (customization preset + sounds CLI parses)
        run: |
          python main.py render --preset presets/minimal_mono_15s.json --seconds 4 --fps 30 --set slowmo_final=true --out output/custom.mp4
          python main.py sounds cache

      - name: Smoke test (Escape + Breaker modes, duplicate checker CLI)
        run: |
          python main.py render --preset presets/escape_rings.json --seconds 4 --fps 30 --out output/escape.mp4
          python main.py render --mode breaker --seconds 4 --fps 30 --out output/breaker.mp4
          python main.py render --preset presets/glass_rush.json --seconds 4 --fps 30 --out output/glass.mp4
          python main.py render --preset presets/ghost_escape.json --seconds 4 --fps 30 --out output/ghost.mp4
          python main.py render --preset presets/rhythmic_joy.json --seconds 4 --fps 30 --out output/rhythmic.mp4
          python main.py render --mode accumulate --seconds 4 --fps 30 --out output/accumulate.mp4
          python main.py render --preset presets/drawer_art.json --seconds 4 --fps 30 --out output/drawer.mp4
          python main.py render --preset presets/glass_tower.json --seconds 4 --fps 30 --out output/tower.mp4
          python main.py render --preset presets/flag_battle.json --seconds 4 --fps 30 --out output/battle.mp4
          python main.py render --preset presets/weapon_battle.json --seconds 4 --fps 30 --out output/weapon.mp4
          python main.py render --preset presets/plinko_jackpot.json --seconds 4 --fps 30 --out output/plinko.mp4
          python main.py dedupe --in output

      - name: Smoke test (AI add-on imports, app still imports without models)
        run: python -c "import onnxruntime, mm911.imageprep as ip, mm911.gui.app; print(onnxruntime.__version__, ip.status()['onnx'])"

      - name: Build portable exe
        run: >
          pyinstaller main.py --noconfirm --onefile --windowed
          --name MoneyMaker911
          --icon mm911/assets/brand/logo.ico
          --add-data "mm911/assets;mm911/assets"
          --add-data "mm911/gui/web;mm911/gui/web"
          --collect-all imageio_ffmpeg
          --collect-all webview
          --collect-binaries onnxruntime
          --hidden-import clr

      - uses: actions/upload-artifact@v4
        with:
          name: MoneyMaker911-portable
          path: dist/MoneyMaker911.exe

      - name: Publish nightly release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release delete nightly -y --cleanup-tag || true
          gh release create nightly dist/MoneyMaker911.exe --prerelease --target "$GITHUB_SHA" \
            --title "Nightly build" \
            --notes "Portable Windows build of the latest commit ($GITHUB_SHA). Just download and double-click, no install."

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" dist/MoneyMaker911.exe --title "$GITHUB_REF_NAME" --generate-notes
